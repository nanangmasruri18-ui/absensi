<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Absensi Siswa SD</title>
    <meta name="description" content="Sistem Absensi Siswa Sekolah Dasar dengan Hak Akses Admin dan Guru, fitur Import/Export Excel, cetak PDF, dan Laporan Rekapitulasi Lengkap." />
    <meta property="og:title" content="Aplikasi Absensi Siswa SD" />
    <meta property="og:description" content="Sistem Absensi Siswa Sekolah Dasar dengan Hak Akses Admin dan Guru, fitur Import/Export Excel, cetak PDF, dan Laporan Rekapitulasi Lengkap." />

    <!-- Trap and prevent benign Vite HMR websocket disconnection error in cloud container runtime -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            class FakeWebSocket extends EventTarget {
              static CONNECTING = 0;
              static OPEN = 1;
              static CLOSING = 2;
              static CLOSED = 3;
              CONNECTING = 0;
              OPEN = 1;
              CLOSING = 2;
              CLOSED = 3;
              readyState = 1;
              url = '';
              protocol = '';
              binaryType = 'blob';
              bufferedAmount = 0;
              extensions = '';
              onopen = null;
              onclose = null;
              onerror = null;
              onmessage = null;

              constructor(url, protocols) {
                super();
                this.url = String(url || '');
                this.protocol = Array.isArray(protocols) ? (protocols[0] || '') : String(protocols || '');
                setTimeout(() => {
                  this.readyState = 1;
                  const ev = new Event('open');
                  this.dispatchEvent(ev);
                  if (typeof this.onopen === 'function') {
                    try { this.onopen(ev); } catch (e) {}
                  }
                }, 0);
              }

              send(data) {}
              close(code, reason) {
                this.readyState = 3;
              }
            }

            var NativeWebSocket = window.WebSocket;
            function SafeWebSocket(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = String(protocols || '');
              // Vite HMR and local dev websocket connections
              if (
                urlStr.indexOf('vite') !== -1 ||
                urlStr.indexOf('token=') !== -1 ||
                urlStr.indexOf('24678') !== -1 ||
                urlStr.indexOf('5173') !== -1 ||
                protoStr.indexOf('vite') !== -1 ||
                !NativeWebSocket
              ) {
                return new FakeWebSocket(url, protocols);
              }
              try {
                return new NativeWebSocket(url, protocols);
              } catch (e) {
                return new FakeWebSocket(url, protocols);
              }
            }

            SafeWebSocket.CONNECTING = 0;
            SafeWebSocket.OPEN = 1;
            SafeWebSocket.CLOSING = 2;
            SafeWebSocket.CLOSED = 3;
            SafeWebSocket.prototype = FakeWebSocket.prototype;
            window.WebSocket = SafeWebSocket;
          }
        } catch (e) {}

        // Intercept console.error to suppress [vite] websocket connection messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return typeof a === 'string' ? a : (a && a.message) || String(a);
          }).join(' ');

          if (
            joined.indexOf('[vite]') !== -1 || 
            joined.indexOf('WebSocket') !== -1 || 
            joined.indexOf('websocket') !== -1 ||
            joined.indexOf('closed without opened') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // Catch and suppress unhandled promise rejections & window errors for WebSocket
        var isWsError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('websocket') !== -1 || 
                 str.indexOf('failed to connect') !== -1 ||
                 str.indexOf('closed without opened') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && isWsError(event.message || event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
