<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Absensi Siswa SD</title>
    <meta name="description" content="Sistem Absensi Siswa Sekolah Dasar dengan Hak Akses Admin dan Guru, fitur Import/Export Excel, cetak PDF, dan Laporan Rekapitulasi Lengkap." />
    <meta property="og:title" content="Aplikasi Absensi Siswa SD" />
    <meta property="og:description" content="Sistem Absensi Siswa Sekolah Dasar dengan Hak Akses Admin dan Guru, fitur Import/Export Excel, cetak PDF, dan Laporan Rekapitulasi Lengkap." />

    <!-- Trap and prevent benign Vite HMR websocket disconnection error in cloud container runtime -->
    <script>
      (function() {
        // 1. Mock WebSocket for Vite HMR so Vite client never errors or closes
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = String(protocols || '');
              if (urlStr.indexOf('token=') !== -1 || protoStr.indexOf('vite-hmr') !== -1) {
                var fakeWs = {
                  readyState: 1, // OPEN
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    if (type === 'open') {
                      setTimeout(function() { try { fn({ type: 'open' }); } catch(e){} }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
                setTimeout(function() {
                  if (typeof fakeWs.onopen === 'function') {
                    try { fakeWs.onopen({ type: 'open' }); } catch(e) {}
                  }
                }, 0);
                return fakeWs;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
          }
        } catch(e) {}

        // 2. Intercept console.error to suppress [vite] websocket connection messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return typeof a === 'string' ? a : (a && a.message) || String(a);
          }).join(' ');

          if (joined.indexOf('[vite]') !== -1 || 
              joined.indexOf('WebSocket') !== -1 || 
              joined.indexOf('websocket') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // 3. Catch and suppress any unhandled promise rejections relating to WebSocket
        var isWsError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('websocket') !== -1 || 
                 str.indexOf('failed to connect') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && isWsError(event.message || event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
